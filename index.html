<!doctype html>
<html lang="en">
  <head>
    <script>
      // Filter benign Vite development websocket connection logs in iframe preview
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && (args[0].includes('[vite] failed to connect to websocket') || args[0].includes('vite-pwa-plugin:dev-ready'))) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V-Chat - Varma & Varma Mumbai Branch</title>
    <meta name="description" content="Internal communication, task allocation, WhatsApp-style group collaboration, and compliance tracking app for Varma & Varma Mumbai Branch Chartered Accountants." />
    <meta property="og:title" content="V-Chat - Varma & Varma Mumbai Branch" />
    <meta property="og:description" content="Internal communication, task allocation, WhatsApp-style group collaboration, and compliance tracking app for Varma & Varma Mumbai Branch Chartered Accountants." />
